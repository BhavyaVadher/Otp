{% extends "base.html" %}
{% block title %}Log in · OTP Desk{% endblock %}
{% block body %}
<div style="max-width: 360px; margin: 10vh auto 0;">
  <h1 style="margin-bottom: 16px;">OTP Desk</h1>
  {% if flash %}<div class="flash {{ flash.kind }}">{{ flash.message }}</div>{% endif %}
  <form class="card" method="post" action="/login">
    <label for="username">User ID</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit" style="width: 100%;">Log in</button>
  </form>
</div>
{% endblock %}
