<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}OTP Desk{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #fff; --text: #1c1f24; --muted: #6b7280;
      --border: #e3e5e9; --accent: #2563eb; --accent-text: #fff;
      --danger: #dc2626; --success-bg: #ecfdf3; --success: #067647;
      --error-bg: #fef3f2; --error: #b42318; --code-bg: #f0f4ff;
      --press: rgba(0, 0, 0, .06); --press-strong: rgba(0, 0, 0, .12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317; --card: #1a1d23; --text: #e8eaed; --muted: #9aa1ab;
        --border: #2c3038; --accent: #4f8bff; --accent-text: #fff;
        --danger: #f87171; --success-bg: #0f2a1d; --success: #6ce9a6;
        --error-bg: #2d1515; --error: #fda29b; --code-bg: #1d2740;
        --press: rgba(255, 255, 255, .06); --press-strong: rgba(255, 255, 255, .12);
      }
    }
    * { box-sizing: border-box; }
    /* Elements styled with their own display (e.g. inline-block badges) must still hide. */
    [hidden] { display: none !important; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 15px; margin: 0 0 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
    input {
      width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button, .btn { font: inherit; cursor: pointer; border-radius: 8px; }
    .btn { padding: 10px 16px; border: 0; background: var(--accent); color: var(--accent-text); font-weight: 600; }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn-plain { padding: 6px 10px; border: 1px solid var(--border); background: transparent; color: var(--text); }
    a.btn, a.btn-plain { display: inline-block; text-decoration: none; }
    .btn-danger { color: var(--danger); }

    /* Press feedback: buttons sink and darken while held, like a real button. */
    button, .btn, .btn-plain {
      -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none;
      transition: transform .08s ease, filter .12s ease, background-color .12s ease,
                  box-shadow .12s ease, color .12s ease;
    }
    .btn { box-shadow: 0 1px 2px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .18); }
    .btn:hover:not(:disabled) { filter: brightness(1.08); }
    .btn:active:not(:disabled) {
      transform: scale(.96) translateY(1px); filter: brightness(.9);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, .3);
    }
    .btn-plain:hover:not(:disabled) { background-color: var(--press); }
    .btn-plain:active:not(:disabled) { transform: scale(.96); background-color: var(--press-strong); }
    button:focus-visible, .btn:focus-visible, .btn-plain:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    /* Brief confirmation after a copy. */
    .btn.copied, .btn-plain.copied {
      background-color: var(--success-bg); color: var(--success); border-color: transparent;
      box-shadow: none; filter: none;
    }
    .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
    .flash.error { background: var(--error-bg); color: var(--error); }
    .flash.success { background: var(--success-bg); color: var(--success); }
    .muted { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    {% block body %}{% endblock %}
  </div>
<script>
  // iPhone Safari only shows :active press styles when the page listens for touches.
  document.addEventListener("touchstart", () => {}, { passive: true });
</script>
</body>
</html>
